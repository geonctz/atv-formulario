<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <div class="container">
        <h1>Arturito</h1>
        <h3>Reserva Exclusiva de Mesas</h3>

        <form>
            <div class="form-control">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome"/>
            </div>

            <div class="form-control">
            <label for="email">E-mail de Confirmação</label>
            <input type="email" id="email"/>
            </div>

            <div class="form-control">
                <label for="numero">Telefone/WhatsApp</label>
                <input type="text" id="numero"/>
            </div>

            <div class="form-control">
                <label for="data">Data da Reserva</label>
                <input type="date" id="data" />
            </div>

            <div class="form-control">
                <label for="ambiente">Ambiente/Experiência</label>
                <select id="ambiente">
                    <option value="Selecione um ambiente"></option>
                    <option value="salao">Salão Principal (Clássico & Acolhedor)</option>
                    <option value="terraco">Terraço Panorâmico (Vista para a Cidade)</option>           
                    <option value="jardim">Jardim de Inverno (Ar Livre & Reservado)</option>
                    <option value="vip">Espaço VIP (Privativo para Eventos)</option>
                </select>
            </div>

            <div class="form-control">
                <label for="senha">Senha de Acesso</label>
                <input type="password" id="senha" />
            </div>

            <div class="form-control">
                <button type="submite"class="btn-confirmar">CONFIRMAR RESERVA</button>
            </div>

        </form>
    </div>
    
</body>
</html>
